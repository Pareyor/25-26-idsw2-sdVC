services:
  db:
    image: postgres:15-alpine
    container_name: jorgestor-db
    environment:
      POSTGRES_DB: jorgestor
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - jorgestor-data:/var/lib/postgresql/data

volumes:
  jorgestor-data:
